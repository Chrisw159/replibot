services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: replibot
      POSTGRES_USER: replibot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replibot"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: postgres://replibot:${POSTGRES_PASSWORD}@postgres:5432/replibot
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://replibot:${POSTGRES_PASSWORD}@postgres:5432/replibot
      SESSION_SECRET: ${SESSION_SECRET}
      XAI_API_KEY: ${XAI_API_KEY:-}
      BETFAIR_USERNAME: ${BETFAIR_USERNAME:-}
      BETFAIR_PASSWORD: ${BETFAIR_PASSWORD:-}
      BETFAIR_APP_KEY: ${BETFAIR_APP_KEY:-}
      NODE_ENV: production
      PORT: 8080
      FORCE_DATA_COLLECTION: ${FORCE_DATA_COLLECTION:-true}
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
    depends_on:
      - api

volumes:
  postgres_data:
